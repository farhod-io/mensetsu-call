<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121a2f" />
      <stop offset="100%" stop-color="#080c18" />
    </linearGradient>

    <!-- Center Radial Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="48%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#1d4ed8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#080c18" stop-opacity="0" />
    </radialGradient>

    <!-- CAL Pill Badge Gradient -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#162a50" />
      <stop offset="100%" stop-color="#0f1b34" />
    </linearGradient>

    <!-- Drop Shadow for Kanji -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#38bdf8" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Full Bleed Background (NO transparent margins, solid for all OS clips) -->
  <rect width="512" height="512" fill="url(#bgGrad)" />

  <!-- Ambient Glow -->
  <rect width="512" height="512" fill="url(#centerGlow)" />

  <!-- Top Specular Highlight Line -->
  <line x1="0" y1="1" x2="512" y2="1" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.8" />
  <line x1="0" y1="2" x2="512" y2="2" stroke="#1d4ed8" stroke-width="2" stroke-opacity="0.4" />

  <!-- CAL Pill Badge -->
  <rect x="206" y="55" width="100" height="34" rx="17" fill="url(#pillGrad)" stroke="#38bdf8" stroke-width="2.5" />
  <text x="256" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="800" fill="#38bdf8" text-anchor="middle" letter-spacing="2">CAL</text>

  <!-- Central High-Impact Kanji: 面 (Mensetsu) -->
  <text x="256" y="355" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif" font-size="260" font-weight="900" fill="#ffffff" text-anchor="middle" filter="url(#shadow)">面</text>

  <!-- Subtitle Label -->
  <text x="256" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="6">MENSETSU</text>
</svg>
